services:
  db:
    image: postgres:16-alpine
    container_name: paw-some-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paw_some_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: paw-some-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paw_some_learning
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-super-secret-key-change-this
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: paw-some-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3000
      PORT: 3000
      WDS_SOCKET_PORT: 0
    depends_on:
      - backend

volumes:
  postgres_data: